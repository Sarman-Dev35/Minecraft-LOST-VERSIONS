name: Build Alpha
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Test game systems
        run: npm test
      - name: Build web game
        run: npm run build
      - name: Package build
        run: |
          cd dist
          zip -r ../Minecraft-LOST-VERSIONS-Alpha-0.3-dev.zip .
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-LOST-VERSIONS-Alpha-0.3-dev
          path: Minecraft-LOST-VERSIONS-Alpha-0.3-dev.zip
          if-no-files-found: error
          retention-days: 14
